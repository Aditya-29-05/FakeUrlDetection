services:
  - type: web
    name: phishguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_NAME
        value: phishing_detector
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
